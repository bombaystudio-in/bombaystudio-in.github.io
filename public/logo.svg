<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 50" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Bombay Studio Logo</title>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>

  <!-- Architectural Diamond Emblem -->
  <g transform="translate(4, 3)">
    <polygon points="22,2 42,22 22,42 2,22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <polygon points="22,8 36,22 22,36 8,22" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
    <circle cx="22" cy="22" r="3.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <text x="56" y="32" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="4.5">BOMBAY</text>
  <text x="210" y="32" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900">°</text>
  <text x="232" y="32" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="4.5">STUDIO</text>
</svg>
