<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <defs>
    <linearGradient id="goldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="30%" stop-color="#FCF6BA" />
      <stop offset="70%" stop-color="#B38728" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#050505" stroke="url(#goldGradFav)" stroke-width="2"/>

  <!-- Architectural Diamond Motif -->
