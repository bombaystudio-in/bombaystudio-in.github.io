  <polygon points="32,15 45,28 32,41 19,28" fill="none" stroke="url(#goldGradFav)" stroke-width="1" opacity="0.6"/>

  <!-- Center Monogram -->
  <text x="32" y="34" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="1">
    B<tspan fill="url(#goldGradFav)">°</tspan>S
